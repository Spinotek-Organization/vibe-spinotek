<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="grassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55c944"/>
      <stop offset="100%" stop-color="#38942b"/>
    </linearGradient>
    <linearGradient id="dirtSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a5e38"/>
      <stop offset="100%" stop-color="#54371e"/>
    </linearGradient>
    <linearGradient id="dirtRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e492a"/>
      <stop offset="100%" stop-color="#3e2713"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22c55e" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.18" filter="url(#glow)"/>

  <!-- 3D Voxel Grass Cube -->
  <g transform="translate(256, 256) scale(1.35)">
    <!-- Top Face (Isometric rhombus) -->
    <polygon points="0,-90 100,-35 0,20 -100,-35" fill="url(#grassTop)"/>
    <!-- Top Grass Pixel Details -->
    <polygon points="-20,-50 20,-30 0,-15 -40,-35" fill="#6be358" opacity="0.6"/>
    <polygon points="30,-60 65,-40 45,-25 10,-45" fill="#46ad36" opacity="0.8"/>
    
    <!-- Left Face (Dirt + Grass overhang) -->
    <polygon points="-100,-35 0,20 0,135 -100,80" fill="url(#dirtSide)"/>
    <!-- Left Grass Overhang -->
    <polygon points="-100,-35 0,20 0,45 -20,35 -40,55 -60,30 -80,45 -100,25" fill="#38942b"/>

    <!-- Right Face (Dirt + Grass overhang) -->
    <polygon points="0,20 100,-35 100,80 0,135" fill="url(#dirtRight)"/>
    <!-- Right Grass Overhang -->
    <polygon points="0,20 100,-35 100,20 80,40 60,25 40,50 20,30 0,45" fill="#2d7a22"/>

    <!-- Pixel Dirt Flecks -->
    <rect x="-70" y="60" width="12" height="12" fill="#3e2713" opacity="0.7"/>
    <rect x="-40" y="80" width="14" height="10" fill="#a47246" opacity="0.6"/>
    <rect x="30" y="65" width="14" height="12" fill="#2d1c0c" opacity="0.8"/>
    <rect x="60" y="85" width="12" height="10" fill="#8a5e38" opacity="0.6"/>
  </g>

  <!-- Pickaxe / Diamond Emblem Sparkles -->
  <circle cx="110" cy="120" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="400" cy="130" r="8" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="390" cy="380" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="120" cy="370" r="7" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Spinocraft text emblem at bottom -->
  <text x="256" y="468" text-anchor="middle" font-family="'Press Start 2P', monospace, sans-serif" font-size="28" font-weight="bold" fill="#facc15" letter-spacing="4">SPINOCRAFT</text>
</svg>
